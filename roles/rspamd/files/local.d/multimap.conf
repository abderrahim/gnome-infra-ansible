sender_envfrom_deny {
  description = "Sender envelope from deny list";
  type = "from";
  filter = "email:domain";
  map = "$LOCAL_CONFDIR/local.d/maps.d/sender_envfrom_deny.map.local";
  symbol = "SENDER_ENVFROM_DENY";
  prefilter = true;
  action = "reject";
}
sender_envfrom_allow {
  description = "Known legitimate sender";
  type = "from";
  extract_from = "both";
  filter = "email:addr";
  map = "$LOCAL_CONFDIR/local.d/maps.d/sender_envfrom_allow.map.local";
  symbol = "SENDER_ENVFROM_ALLOW";
  score = -5.0;
  require_symbols = "DKIM_VALID_AU";
}
